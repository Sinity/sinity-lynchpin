schema = 1

[project]
id = "lynchpin"
display_name = "Lynchpin"
root_markers = ["pyproject.toml", "lynchpin"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
# The files the devShell evaluation reads (its drvPath does not depend on the
# source tree). Jobs enter a cached `nix print-dev-env` realization keyed on
# them instead of evaluating the devShell twice per new tree state.
cache_inputs = ["flake.nix", "flake.lock"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "LYNCHPIN_REPO_ROOT", "LYNCHPIN_LOCAL_ROOT", "POLYLOGUE_ROOT", "SINEX_ROOT", "RAWLOG_FILE", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME", "LYNCHPIN_FILESYSTEM_LAYOUT", "LYNCHPIN_ASCIINEMA_ROOT", "LYNCHPIN_CHISEL_CACHE_ROOT", "LYNCHPIN_CHISEL_SCRATCH_ROOT", "LYNCHPIN_DATA_ROOT", "LYNCHPIN_HEALTH_ROOT", "LYNCHPIN_SAMSUNG_GDPR_CLOUD", "LYNCHPIN_SLEEP_JSONL", "SINEX_RUNTIME_TARGET_CONFIG", "LYNCHPIN_SINEX_HEALTH_CA_CERT", "LYNCHPIN_APPLICATION_HEALTH_TIMEOUT", "LYNCHPIN_APPLICATION_HEALTH"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
root = "/realm/worktree"
default_base = "origin/master"
verify = { focused = "check", candidate = "check" }
publish = "master"

[operations.check]
description = "Run Lynchpin lint, maintained type checks, and default tests"
exec = ["just", "check"]
pool = "bulk"
result = "exit"
cache = "tree+environment"

[operations.test]
description = "Run selected tests; pass pytest paths or -k expressions after --"
exec = ["pytest", "-q"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.lint]
description = "Run Lynchpin Ruff checks"
exec = ["just", "lint"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.snapshot_layout]
description = "Describe owner-led canonical snapshot placement without opening payloads"
exec = ["python", "-m", "lynchpin.cli.chisel", "layout"]
pool = "normal"
result = "exit"
cache = "none"

[operations.input_activity]
description = "Reconstruct private input evidence from explicit time bounds"
exec = ["python", "-m", "lynchpin.analysis", "input-activity"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 1800

[operations.materialize_plan]
description = "Render the bounded maintenance plan without writes"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--plan-json", "--progress", "quiet"]
pool = "normal"
result = "exit"
cache = "none"

[operations.converge]
description = "Materialize, verify, and publish the complete Lynchpin maintenance snapshot"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--progress", "plain"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 14400

[operations.refresh_keylog]
description = "Refresh and verify the low-latency keylog analysis product"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "refresh", "--product", "keylog_analysis"]
pool = "normal"
result = "json"
cache = "none"
# A routine refresh rescans only the days whose raw keylog files changed and
# finishes in seconds. The budget covers a cold cache, which reparses the whole
# 14-day window at roughly 11 MB/s.
timeout_seconds = 1800

[operations.repair_operator_day]
description = "Explicitly rebuild operator days for a requested inclusive date range in a verified candidate"
exec = ["python", "-m", "lynchpin.analysis", "materialize-current-state", "--up-to", "current_state_operator_day"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.repair_webhistory_base]
description = "Merge retained browser segments into an explicit candidate output without raw extraction"
exec = ["python", "-m", "lynchpin.ingest.webhistory", "--merge-only"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 1800
admission = { memory_mib = 6144 }

[operations.materialize_node]
description = "Execute one typed canonical-product materialization node"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "node"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 3600

[operations.repair_activitywatch_index]
description = "Explicitly rebuild the ActivityWatch day index from retained owner-native databases"
exec = ["python", "-m", "lynchpin.ingest.activitywatch_event_index_materialize", "--full"]
pool = "bulk"
result = "json"
cache = "none"
timeout_seconds = 7200

[operations.repair_activitywatch_derived]
description = "Explicitly repair a bounded ActivityWatch-derived history window from retained indexed events"
exec = ["python", "-m", "lynchpin.ingest.activitywatch_derived_materialize"]
arguments = "required"
pool = "bulk"
result = "json"
cache = "none"
timeout_seconds = 7200

[operations.repair_git_facts]
description = "Recompute commit and file-change artifacts from owner Git histories for explicit start/end dates"
exec = ["python", "-c", "import sys; from datetime import date; from lynchpin.analysis.active.git_facts import run_active_git_facts; run_active_git_facts('active_commit_facts.json', 'active_file_change_facts.json', start=date.fromisoformat(sys.argv[1]), end=date.fromisoformat(sys.argv[2]))"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 7200

[operations.raindrop_archive]
description = "Acquire and validate one complete Raindrop metadata bundle while preserving prior exports"
exec = ["python", "-m", "lynchpin.ingest.raindrop_archive", "--metadata"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.repair_machine_telemetry_archive]
description = "Verify retained telemetry partitions and backfill missing sealed days without changing captured SQLite rows"
exec = ["python", "-m", "lynchpin.cli.machine_telemetry_export"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 7200

[operations.recompute_activity_products]
description = "Recompute affected ActivityWatch-derived history and publish typed facts with its graph"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "all", "--full", "--only", "activity_content", "personal_daily_signals", "temporal_signals", "sleep_productivity", "--progress", "plain"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 14400

[operations.promote_node]
description = "Atomically publish one complete substrate generation"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "promote"]
pool = "bulk"
result = "json"
cache = "none"
timeout_seconds = 7200

[operations.chisel]
description = "Build the complete configured cross-project Chisel report portfolio"
exec = ["just", "chisel"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 900

[operations.cleanup_machine_staging]
description = "Preview or remove abandoned machine-carrier staging files through the owning materializer"
exec = ["python", "-m", "lynchpin.ingest.machine_materialize", "--cleanup-staging"]
timeout_seconds = 900
pool = "normal"
cache = "none"

[operations.promote_incremental]
description = "Refresh stale source tails and atomically promote the affected substrate window"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--progress", "plain"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 7200

[operations.refresh_health]
description = "Refresh and verify phone and band coverage without rebuilding the substrate"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "refresh", "--product", "health_coverage"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 1800

[operations.preview_health_exports]
description = "Read retained health exports and report recomputation counts without publishing"
exec = ["python", "-m", "lynchpin.cli.process_health", "--dry-run"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 3600

[operations.recompute_health_exports]
description = "Recompute existing health and fused-sleep products from retained exports"
exec = ["python", "-m", "lynchpin.cli.process_health"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 3600

# Codex quota is reserved (operator, 2026-09-29): batch workers, reviewers and
# every bead model_policy run on Claude Opus 5.5.
[packets.defaults]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

[packets.review]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

[packets.model_policy.provider-neutral-calibrated-v2]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-neutral-capability-v1]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-pinned-v1]
backend = "claude"
model = "claude-opus-5-5"

[operations.snapshot_locations]
description = "Plan or publish current snapshot lookup address changes without rebuilding captures"
exec = ["python", "-m", "lynchpin.cli.snapshot_locations"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 1800

[operations.verify_package]
description = "Build packaged API and MCP entry points with neutral deployment configuration"
exec = ["nix", "build", "--no-link", ".#api-python", ".#default"]
pool = "normal"
result = "exit"
cache = "tree+environment"
timeout_seconds = 1800

[operations.repair_machine_facts]
description = "Restore machine typed facts through the existing source-selected promotion route"
exec = ["python", "-m", "lynchpin.analysis", "materialize-machine", "--up-to", "machine_analysis_substrate_promote"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 7200
# Full restoration needs headroom for native allocations beyond DuckDB buffers.
admission = { memory_mib = 10240 }

[operations.asciinema_index]
description = "Refresh the header-only terminal capture index without reading event streams"
exec = ["python", "-m", "lynchpin.cli.asciinema_index"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 900
