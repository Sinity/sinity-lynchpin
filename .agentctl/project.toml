schema = 1

[project]
id = "lynchpin"
display_name = "Lynchpin"
root_markers = ["pyproject.toml", "lynchpin"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
# The files the devShell evaluation reads (its drvPath does not depend on the
# source tree). Jobs enter a cached `nix print-dev-env` realization keyed on
# them instead of evaluating the devShell twice per new tree state.
cache_inputs = ["flake.nix", "flake.lock"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "LYNCHPIN_REPO_ROOT", "POLYLOGUE_ROOT", "SINEX_ROOT", "RAWLOG_FILE", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
root = "/realm/worktrees"
default_base = "origin/master"
verify = { focused = "check", candidate = "check" }
publish = "master"

[operations.check]
description = "Run Lynchpin lint, maintained type checks, and default tests"
exec = ["just", "check"]
pool = "bulk"
result = "exit"
cache = "tree+environment"

[operations.verify_incremental]
description = "Verify nightly incremental planning, source boundaries, and publication routes"
exec = ["pytest", "-q", "tests/test_typed_materializers.py", "tests/cli/test_materialize.py", "tests/cli/test_agentctl_plan.py", "tests/ingest/test_exports_materialize.py", "tests/ingest/test_gmail_takeout_materialize.py", "tests/mcp/test_mcp_substrate.py"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.verify_runtime_status]
description = "Verify nightly failure and serving freshness status"
exec = ["pytest", "-q", "tests/core/test_freshness.py", "tests/mcp/test_mcp_substrate.py", "-k", "materialization_status or materialization_health or nightly_status or runtime_status"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.verify_plan_boundaries]
description = "Verify explicit temporal inputs and ActivityContent recovery boundaries"
exec = ["pytest", "-q", "tests/ingest/test_activity_content_materialize.py", "tests/ingest/test_temporal_signals_materialize.py", "tests/test_typed_materializers.py", "tests/cli/test_materialize.py"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.verify_webhistory_base]
description = "Verify retained-segment candidate merge and input identity contracts"
exec = ["pytest", "-q", "tests/ingest/test_webhistory.py", "tests/test_materialization.py", "-k", "webhistory"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.verify_partial_publication]
description = "Verify unavailable Polylogue status and optional-feed publication policy"
exec = ["pytest", "-q", "tests/cli/test_materialize.py", "tests/test_materialization.py", "-k", "snapshot_promotion or polylogue_dataset or incremental_graph_tail or incremental_candidate_identity"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.lint]
description = "Run Lynchpin Ruff checks"
exec = ["just", "lint"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.verify_owner_products]
description = "Verify campaign owner snapshots, bounded project context, and public action contracts"
exec = ["pytest", "-q", "tests/analysis/test_campaign_evidence.py", "tests/analysis/test_campaign_history.py", "tests/analysis/test_project_owner_products.py", "tests/mcp/test_mcp_public.py", "tests/mcp/test_mcp_registration.py"]
pool = "pytest"
result = "exit"
cache = "tree+environment"

[operations.input_activity]
description = "Reconstruct private input evidence from explicit time bounds"
exec = ["python", "-m", "lynchpin.analysis", "input-activity"]
pool = "normal"
result = "exit"
cache = "none"
timeout_seconds = 1800

[operations.materialize_plan]
description = "Render the bounded maintenance plan without writes"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--plan-json", "--progress", "quiet"]
pool = "normal"
result = "exit"
cache = "none"

[operations.converge]
description = "Materialize, verify, and publish the complete Lynchpin maintenance snapshot"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--progress", "plain"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 14400

[operations.refresh_keylog]
description = "Refresh and verify the low-latency keylog analysis product"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "refresh", "--product", "keylog_analysis"]
pool = "normal"
result = "json"
cache = "none"
# A routine refresh rescans only the days whose raw keylog files changed and
# finishes in seconds. The budget covers a cold cache, which reparses the whole
# 14-day window at roughly 11 MB/s.
timeout_seconds = 1800

[operations.repair_webhistory_base]
description = "Merge retained browser segments into an explicit candidate output without raw extraction"
exec = ["python", "-m", "lynchpin.ingest.webhistory", "--merge-only"]
arguments = "required"
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 1800
admission = { memory_mib = 6144 }

[operations.materialize_node]
description = "Execute one typed canonical-product materialization node"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "node"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 3600

[operations.promote_node]
description = "Atomically publish one complete substrate generation"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "promote"]
pool = "bulk"
result = "json"
cache = "none"
timeout_seconds = 7200

[operations.chisel]
description = "Build the complete configured cross-project Chisel report portfolio"
exec = ["just", "chisel"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 900

[operations.cleanup_machine_staging]
description = "Preview or remove abandoned machine-carrier staging files through the owning materializer"
exec = ["python", "-m", "lynchpin.ingest.machine_materialize", "--cleanup-staging"]
timeout_seconds = 900
pool = "normal"
cache = "none"

[operations.promote_incremental]
description = "Refresh stale source tails and atomically promote the affected substrate window"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--promote", "--history", "incremental", "--progress", "plain"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 7200

[operations.refresh_health]
description = "Refresh and verify phone and band coverage without rebuilding the substrate"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "refresh", "--product", "health_coverage"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 1800

# Codex quota is reserved (operator, 2026-09-29): batch workers, reviewers and
# every bead model_policy run on Claude Opus 5.5.
[packets.defaults]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

[packets.review]
backend = "claude"
model = "claude-opus-5-5"
effort = "medium"

[packets.model_policy.provider-neutral-calibrated-v2]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-neutral-capability-v1]
backend = "claude"
model = "claude-opus-5-5"

[packets.model_policy.provider-pinned-v1]
backend = "claude"
model = "claude-opus-5-5"
