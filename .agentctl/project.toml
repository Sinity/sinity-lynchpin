schema = 1

[project]
id = "lynchpin"
display_name = "Lynchpin"
root_markers = ["pyproject.toml", "lynchpin"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
preflight = ["just", "--list"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "LYNCHPIN_REPO_ROOT", "POLYLOGUE_ROOT", "SINEX_ROOT", "KNOWLEDGEBASE_ROOT", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]

[workspace]
provider = "git-worktree"
root = "/realm/worktrees"
default_base = "origin/master"
identity_check = ["git", "diff", "--quiet", "--", "pyproject.toml", "flake.nix"]
checkpoint_untracked = true
verification_operations = ["check"]

[conflicts]
exact_files = ["pyproject.toml", "flake.nix"]
generated_surfaces = ["docs/reference/schema-support-matrix.md"]

[conflicts.semantic_slots]
materialization-registry = ["lynchpin/materialization.py", "lynchpin/ingest/**/*.py"]
substrate-schema = ["lynchpin/substrate/**/*.py"]
public-mcp-contract = ["lynchpin/mcp/**/*.py", "tests/test_mcp*.py"]

[operations.check]
description = "Run Lynchpin lint, maintained type checks, and default tests"
exec = ["just", "check"]
pool = "bulk"
result = "exit"
cache = "tree+environment"
scratch = "nvme"

[operations.lint]
description = "Run Lynchpin Ruff checks"
exec = ["just", "lint"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.materialize_plan]
description = "Render the current canonical materialization plan without writes"
exec = ["python", "-m", "lynchpin.cli.materialize", "--all", "--plan-json", "--progress", "quiet"]
pool = "normal"
result = "exit"
cache = "tree+environment"

[operations.schedule_convergence]
description = "Plan and submit bounded typed materialization nodes through AgentCTL"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "submit"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 300
exclusive_keys = ["lynchpin:convergence-scheduling"]

[operations.materialize_node]
description = "Execute one typed canonical-product materialization node"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "node"]
pool = "normal"
result = "json"
cache = "none"
scratch = "nvme"
timeout_seconds = 3600
plan_node = true

[operations.materialize_node.parameters.product]
type = "string"
flag = "--product"
required = true
max_length = 128
grammar = "safe-token"

[operations.materialize_node.parameters.input_generation]
type = "string"
flag = "--input-generation"
required = true
max_length = 128
grammar = "safe-token"

[operations.materialize_node.parameters.source_generation]
type = "string"
flag = "--source-generation"
required = true
max_length = 128
grammar = "safe-token"

[operations.materialize_node.parameters.planned_dependencies]
type = "bool"
flag = "--planned-dependencies"

[operations.materialize_node.parameters.start]
type = "string"
flag = "--start"
max_length = 10
grammar = "safe-token"

[operations.materialize_node.parameters.end]
type = "string"
flag = "--end"
max_length = 10
grammar = "safe-token"

[operations.promote_node]
description = "Atomically publish one bounded substrate graph tail"
exec = ["python", "-m", "lynchpin.cli.agentctl_plan", "promote"]
pool = "bulk"
result = "json"
cache = "none"
scratch = "nvme"
timeout_seconds = 7200
exclusive_keys = ["lynchpin:substrate-generation"]
plan_node = true

[operations.promote_node.parameters.start]
type = "string"
flag = "--start"
required = true
max_length = 10
grammar = "safe-token"

[operations.promote_node.parameters.end]
type = "string"
flag = "--end"
required = true
max_length = 10
grammar = "safe-token"

[operations.promote_node.parameters.tail_start]
type = "string"
flag = "--tail-start"
required = true
max_length = 10
grammar = "safe-token"

[operations.promote_node.parameters.input_generation]
type = "string"
flag = "--input-generation"
required = true
max_length = 128
grammar = "safe-token"

[operations.chisel]
description = "Build the complete configured cross-project Chisel report portfolio"
exec = ["just", "chisel"]
pool = "bulk"
result = "exit"
cache = "none"
scratch = "nvme"
timeout_seconds = 900

[operations.cleanup_machine_staging]
description = "Preview or remove abandoned machine-carrier staging files through the owning materializer"
exec = ["python", "-m", "lynchpin.ingest.machine_materialize", "--cleanup-staging"]
timeout_seconds = 900
pool = "normal"
scratch = "nvme"
cache = "none"
exclusive_keys = ["lynchpin:machine-carrier-staging"]

[operations.cleanup_machine_staging.parameters.apply]
type = "bool"
flag = "--apply"

[operations.cleanup_machine_staging.parameters.grace_period_s]
type = "int"
flag = "--grace-period-s"
